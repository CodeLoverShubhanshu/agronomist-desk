<title>Gramik Agronomist Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: left rail of desks (Today, Farmers, Orders); the farmer page opens in the main area; Lens products slide in from the right. Gramik Lens look, light only like Lens. */
:root{color-scheme:light;
 --bg:#F3F6F4;--panel:#FFFFFF;--ink:#1D2A24;--muted:#61706A;--line:#DFE6E2;--soft:#F7FAF8;
 --green:#2B5E45;--deep:#1F4A35;--mint:#E4F1E9;--leaf:#3E8E5E;
 --hot:#C9353A;--hot-bg:#FCEBEC;--warm:#B8620F;--warm-bg:#FFF2E4;--blue:#2F5FA7;--blue-bg:#EAF1FB;--violet:#5B3FB0;--violet-bg:#F3EFFC;--soil:#7A5320;--soil-bg:#F3ECE2;
 --sky:#2F6FAE;--sky-bg:#E8F2FB;--sun:#D98A12;
 --display:Outfit,"Mukta",system-ui,sans-serif;--body:Mukta,"Noto Sans Devanagari",system-ui,sans-serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;color:var(--deep)}
.num{font-variant-numeric:tabular-nums}
.app{max-width:1560px;margin:0 auto;padding-block:14px 56px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:start}
/* top bar */
.top{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;background:linear-gradient(160deg,#2E6449,#1F4A35);color:#fff;border-radius:14px;padding:14px 18px}
.top h1{color:#fff;font-size:21px;font-weight:600;letter-spacing:-.01em}.top .dt{color:#CFE3D6;font-size:14px}
.tw{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border-radius:12px;padding:6px 12px;cursor:pointer;border:0;color:#fff;text-align:left}
.tw b{font:600 22px/1 var(--display)}.tw small{display:block;font-size:12px;color:#CFE3D6;line-height:1.3}
.tw:focus-visible{outline:2px solid #F2A65A;outline-offset:2px}
/* rail */
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.nb{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:none;border-radius:9px;padding:9px 10px;cursor:pointer;font-weight:500;text-align:left}
.nb:hover{background:var(--soft)}.nb[aria-current="page"]{background:var(--green);color:#fff}
.nb b{font:600 12px var(--display);border-radius:999px;padding:1px 8px;background:var(--bg);color:var(--muted)}
.nb b.hot{background:var(--hot-bg);color:var(--hot)}.nb[aria-current="page"] b{background:rgba(255,255,255,.2);color:#fff}
.nb:focus-visible,.btn:focus-visible,.chipb:focus-visible,.seg button:focus-visible,.tab:focus-visible,.lk:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.railnote{font-size:12px;color:var(--muted);padding:8px 10px 4px;border-top:1px solid var(--line);margin-top:6px}
main{min-width:0}
/* shared */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card+.card,.stack>*+*{margin-top:14px}
.card h2{font-size:18px;font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.card h2 small,.sub{font:400 14px var(--body);color:var(--muted)}
.sub{margin:2px 0 10px}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
.pagehead h2{font-size:24px}.pagehead p{margin:0;color:var(--muted);font-size:14px}
.chip{display:inline-block;font-size:12px;font-weight:500;border-radius:6px;padding:1px 8px;background:#EEF1EF;color:var(--ink);white-space:nowrap;line-height:1.6}
.chip.hot{background:var(--hot-bg);color:var(--hot)}.chip.warm{background:var(--warm-bg);color:var(--warm)}.chip.ok{background:var(--mint);color:#2A6C45}.chip.blue{background:var(--blue-bg);color:var(--blue)}.chip.violet{background:var(--violet-bg);color:var(--violet)}.chip.soil{background:var(--soil-bg);color:var(--soil)}.chip.sky{background:var(--sky-bg);color:var(--sky)}.chip.mute{background:#EEF1EF;color:var(--muted)}
.chip.solid{background:var(--hot);color:#fff}.chip.green{background:var(--green);color:#fff}.chip.sample{background:#fff;color:var(--muted);box-shadow:inset 0 0 0 1px #C9D2CD}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--green);background:var(--green);color:#fff;border-radius:8px;padding:7px 13px;font-weight:600;cursor:pointer;font-size:15px;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}.btn.ghost:hover{border-color:#B9C6BF}
.btn.sm{padding:4px 10px;font-size:14px;font-weight:500}.btn.warn{background:var(--hot);border-color:var(--hot)}
.btn:disabled{opacity:.5;cursor:default}
.lk{border:0;background:none;color:var(--green);font-weight:600;cursor:pointer;padding:0;font-size:inherit;text-align:left}
.lk:hover{text-decoration:underline}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.muted{color:var(--muted)}.small{font-size:13px}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff;max-width:100%}
textarea{width:100%;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--leaf);outline-offset:1px}
.field{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.field>*:not(span){color:var(--ink);font-size:15px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.form .wide{grid-column:1/-1}
.note{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.note.warm{background:var(--warm-bg);border-color:#F3D6B6}.note.sky{background:var(--sky-bg);border-color:#C9DDF1}.note.hot{background:var(--hot-bg);border-color:#F2C6C8}
.empty{color:var(--muted);padding:18px 4px;text-align:center}
/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;text-align:left;border-top:4px solid var(--line)}
.kpi:hover{border-color:#B9C6BF}.kpi b{display:block;font:600 28px/1.1 var(--display);font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi span{font-size:13px;color:var(--muted)}.kpi.hot{border-top-color:var(--hot)}.kpi.hot b{color:var(--hot)}.kpi.warm{border-top-color:#E8A15A}.kpi.sky{border-top-color:var(--sky)}.kpi.ok{border-top-color:var(--leaf)}.kpi.violet{border-top-color:var(--violet)}
/* list rows */
.rows{list-style:none;margin:0;padding:0}
.rows>li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:11px 0;border-top:1px solid var(--line);align-items:start}
.rows>li:first-child{border-top:0}
.rn{font-weight:600;font-size:16px;line-height:1.3}.rm{font-size:13px;color:var(--muted)}
.rw{font-size:14px;margin-top:2px}
.rr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.gh{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 2px;display:flex;gap:8px;align-items:center}
.gh.hot{color:var(--hot)}
.inline{grid-column:1/-1;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:4px}
/* weather */
.wxhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;justify-content:space-between}
.pinf{display:flex;gap:6px;align-items:center}.pinf input{width:110px;font-variant-numeric:tabular-nums}
.wxnow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:center;margin-top:10px}
.wxnow .big{display:flex;align-items:center;gap:10px}.wxnow .big b{font:600 44px/1 var(--display);font-variant-numeric:tabular-nums}
.wxnow .big small{font:500 18px var(--display);color:var(--muted)}
.wxfacts{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px}.wxfacts b{font-weight:600}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.dc{border:1px solid var(--line);border-radius:10px;padding:8px 4px 6px;text-align:center;background:#fff;font-size:13px;min-width:0}
.dc .dn{font-weight:600;font-size:13px}.dc .dd{color:var(--muted);font-size:11px}
.dc svg{width:26px;height:26px;display:block;margin:4px auto}
.dc .t{font:600 15px var(--display);font-variant-numeric:tabular-nums}.dc .t span{color:var(--muted);font-weight:500}
.dc .r{font-size:11px;color:var(--sky);font-variant-numeric:tabular-nums}
.dc .sp{margin-top:4px;font-size:11px;font-weight:600;border-radius:5px;padding:0 4px}
.sp.y{background:var(--mint);color:#2A6C45}.sp.n{background:var(--warm-bg);color:var(--warm)}
.dc.today{border-color:var(--sky);box-shadow:inset 0 0 0 1px var(--sky)}
.tbar{position:relative;height:6px;border-radius:3px;background:#EEF1EF;margin:5px 6px 0}
.tbar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#7FB3E0,#E9A14A)}
.wxl{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.wxl li{border-left:4px solid var(--leaf);background:var(--soft);border-radius:0 8px 8px 0;padding:6px 10px;font-size:14px}
.wxl li.hot{border-color:var(--hot);background:var(--hot-bg)}.wxl li.warm{border-color:#E8A15A;background:var(--warm-bg)}.wxl li.sky{border-color:var(--sky);background:var(--sky-bg)}
.wxl li .hi{display:block;color:var(--muted);font-size:14px}
.sprayrow{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:12px}.sprayrow>div{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sl{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);min-width:64px}
.advs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px;margin-top:12px}
.adv{border:1px solid var(--line);border-top:4px solid var(--leaf);border-radius:10px;padding:10px 14px;background:#fff;min-width:0}
.adv.hot{border-top-color:var(--hot)}.adv.warm{border-top-color:#E8A15A}.adv.sky{border-top-color:var(--sky)}.adv.soil{border-top-color:#B08A55}
.advt{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.adv.hot .advt{color:var(--hot)}.adv.warm .advt{color:var(--warm)}.adv.sky .advt{color:var(--sky)}.adv.soil .advt{color:var(--soil)}
.adv h4{font-size:16px;font-weight:600;margin-top:1px}
.advd{display:grid;grid-template-columns:72px minmax(0,1fr);gap:6px 10px;margin:8px 0 0;font-size:14px}
.advd dt{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-top:2px}.advd dd{margin:0;min-width:0}
.advd ul{margin:0;padding-left:18px}.advd li{margin:1px 0}
.adv .chip{white-space:normal}
.advhi{margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--line);font-size:14px;color:var(--muted)}
.blk{margin-top:16px}.blkh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}.blkh h3{font-size:17px}
.blk .advs{margin-top:8px}
.adv.leaf{border-top-color:var(--leaf)}.adv.leaf .advt{color:#2A6C45}
.adv.on{box-shadow:0 0 0 2px var(--hot);border-color:transparent}
.hih{font:400 14px var(--body);color:var(--muted)}
.seenck{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:14px;font-weight:500;cursor:pointer}
.seenck input{width:17px;height:17px;accent-color:var(--hot)}
.pwrap{display:flex;gap:10px;align-items:flex-start;min-width:0}
.pimg{flex:0 0 52px;width:52px;height:52px;border-radius:10px;object-fit:cover;background:color-mix(in srgb,var(--tc,#61706A) 10%,#fff);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center}
.pimg svg{width:30px;height:30px}.pimg b{font:600 8px var(--body);letter-spacing:.06em;color:var(--tc,#61706A);margin-top:-1px}
.hstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0 10px}
.hs{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px}.hs b{display:block;font:600 19px var(--display);color:var(--ink)}.hs span{font-size:12px;color:var(--muted)}
tr.rec td{background:#F1F8F3}
.po{list-style:none;margin:10px 0 0;padding:0}
.po li{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;gap:4px 14px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.po li:first-child{border-top:0}.pod{color:var(--muted)}.poa{font-weight:600;text-align:right}
@media (max-width:560px){.po li{grid-template-columns:56px minmax(0,1fr) auto}.po .st{grid-column:2/-1}}
.sgl{list-style:none;margin:10px 0 0;padding:0}
.sg{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line);margin-left:7px}
.sg:last-child{border-left-color:transparent;padding-bottom:0}
.sg::before{content:"";position:absolute;left:-8px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #B9C6BF}
.sg.past::before{background:#B9C6BF}.sg.cur::before{border-color:var(--green);background:var(--green);box-shadow:0 0 0 3px var(--mint)}
.sg.next .sgh b{color:var(--muted)}
.sgh{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}.sgh b{font-family:var(--display);font-weight:600;color:var(--deep)}
.sg .po{margin-top:4px}.sgp{margin-top:6px;align-items:center}.sgp .sl{min-width:0;margin-right:2px}
.pf{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff}
.pf.need{border:2px solid #E8A15A;background:var(--warm-bg)}
.pf h3{font-size:18px}
.pfsay{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.pfsay ol{margin:4px 0 0;padding-left:20px;font-size:15px}.pfsay li{margin:2px 0}
.pfprev{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--mint);border:1px solid #C6E6D2}
.pfprev b{font:600 17px var(--display);color:var(--deep);margin-left:6px}
.pf .seg3 button{white-space:normal;text-align:left}
/* Today: daily call desk (layout from the call dashboard design, Gramik Lens colours) */
.qdesk{gap:24px}
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 16px}
.qhead>div:first-child{display:flex;flex-direction:column;gap:4px}
.qhead .rm{font-size:14px;font-weight:500}
.qhead h1{font:700 clamp(24px,2.6vw,34px)/1.15 var(--display);letter-spacing:-.02em;color:var(--ink);margin:0}
.qsub{font-size:15px;color:var(--muted)}
.btn.qbig{padding:10px 18px;font-size:15px;min-height:44px}.btn.qbig svg,.qa .btn svg{width:16px;height:16px}
.qc{display:flex;flex-direction:column;gap:18px;padding:22px 24px}.card.qc+.card.qc{margin-top:0}
.qch{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px}.qch h2{font-size:17px;font-weight:600;color:var(--ink)}
.qtt{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.qneed{font-size:14px;font-weight:600;color:var(--warm)}.qneed.ok{color:var(--leaf)}
.qbar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:#EEF1EF}.qbar i{display:block;height:100%;background:var(--green)}.qbar i.nc{background:#9CC5AC}
.qbar.thin{height:10px;gap:2px;background:transparent}
.qkeys{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted);margin-top:-8px}.qkeys span{display:inline-flex;align-items:center;gap:6px}.k.nc{background:#9CC5AC}
.qks6{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.qk{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fff;color:inherit}
.qk:not(:disabled){cursor:pointer}.qk:not(:disabled):hover{border-color:#B9C6BF}.qk:disabled{opacity:1}.qk:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.qkl{font-size:13px;font-weight:500;color:var(--muted)}.qk b{font:700 28px/1.1 var(--display);letter-spacing:-.02em;color:var(--ink)}.qks{font-size:13px;color:var(--muted)}
.qcols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.qmain{flex:999 1 960px;min-width:0}.qside{flex:1 1 320px;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:24px;align-items:start}.qside>*+*{margin-top:0}.qside .qc{padding:20px 22px;gap:14px}
.qqh{align-items:center}
.qtabs{display:flex;flex-wrap:wrap;gap:8px}
.qtb{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;min-height:38px;font-variant-numeric:tabular-nums}
.qtb:hover{border-color:#B9C6BF}.qtb[aria-selected="true"]{background:var(--deep);border-color:var(--deep);color:#fff}.qtb:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.qt{font-size:15px;min-width:900px}.qt td{vertical-align:middle;padding:14px 8px}.qt th{padding:10px 8px;font-size:12px;text-transform:none;letter-spacing:0;color:var(--muted)}
.qt tr+tr td,.qt tbody td{border-top:1px solid #ECEEE8;border-bottom:0}
.qf{display:flex;align-items:center;gap:10px}.qn{font-weight:600;color:var(--ink);font-size:15px;text-align:left;white-space:nowrap}.qf .rm{white-space:nowrap}.qfn{min-width:0}
.pri{display:inline-block;flex:0 0 9px;width:9px;height:9px;border-radius:50%;background:#9AA8A1;vertical-align:middle;margin:0 2px 0 8px}.qf .pri{margin:0}
.pri.high{background:#C2410C}.pri.med{background:#D9A11E}.pri.low{background:#9AA8A1}
.qp{color:var(--ink);min-width:160px}
.qs{display:inline-flex;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;white-space:nowrap;background:#EEF0EC;color:#47524C}
.qs.follow{background:var(--warm-bg);color:var(--warm)}.qs.callback{background:var(--blue-bg);color:var(--blue)}.qs.done{background:var(--mint);color:#2A6C45}.qs.overdue{background:var(--hot-bg);color:var(--hot)}
.qa{text-align:right}
.qact{display:flex;flex-direction:column;align-items:flex-end;gap:4px}.qmini{display:flex;gap:10px;font-size:13px}.qmini .lk{font-weight:500}
.qform td{background:var(--soft);padding:0 8px 10px}
.qfoot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.qhr{position:relative;height:150px;display:flex;align-items:flex-end;gap:8px;border-bottom:1px solid var(--line)}
.qgoal{position:absolute;left:0;right:0;border-top:1px dashed #B9C6BF}
.qhc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11px;font-weight:600;color:var(--ink)}
.qhc i{display:block;width:100%;max-width:26px;background:#9CC5AC;border-radius:4px 4px 0 0}.qhc i.hit{background:var(--green)}.qhc i.fut{background:var(--line)}
.qhx{display:flex;gap:8px;margin-top:-6px}.qhx span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.qlg{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13px}.qlg li{display:flex;justify-content:space-between}.qlg span{display:flex;align-items:center;gap:8px}.qlg i{width:10px;height:10px;border-radius:3px}

.tl li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--leaf)}
.tl li:last-child{border-left-color:transparent}
.tl .when{font-size:13px;color:var(--muted)}
/* tables */
.tw2{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:#EEF1EF;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--leaf)}.bar i.warm{background:#E8A15A}.bar i.hot{background:var(--hot)}
.stores{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.store{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.store b{font:600 22px var(--display);font-variant-numeric:tabular-nums}
.st{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.st.Placed::before{background:#9AA8A1}.st.Confirmed::before{background:var(--blue)}.st.Manifested::before{background:var(--violet)}.st.Out::before{background:var(--sky)}.st.Delivered::before{background:var(--leaf)}.st.Rescheduled::before{background:#E8A15A}.st.Returned::before{background:var(--hot)}
/* products drawer (Gramik Lens pop-up) */
.scrim{position:fixed;inset:0;background:rgba(20,35,28,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(20,35,28,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.dh h3{font-size:19px}.dh .x{float:right}
.db{flex:1;overflow:auto;padding:12px 18px}
.df{border-top:1px solid var(--line);padding:12px 18px;background:var(--soft);max-height:46vh;overflow:auto}
.filt{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chipb{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer}
.chipb[aria-pressed="true"]{background:var(--mint);border-color:var(--leaf);font-weight:600}
.pl{list-style:none;margin:0;padding:0}
.pl li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.pn{font-weight:600;font-size:16px}.pt{font-size:12px;color:var(--muted)}
.pr{text-align:right;font:600 15px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}.pr small{display:block;font:400 12px var(--body);color:var(--muted)}
.pw{grid-column:1/-1;font-size:13px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.qty button{border:0;background:#fff;width:30px;height:30px;cursor:pointer;font-weight:700}.qty span{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.tot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-size:14px}.tot .n{text-align:right;font-variant-numeric:tabular-nums}.tot .g{font:600 18px var(--display)}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 6px 18px rgba(20,35,28,.25);border-radius:999px;padding:11px 18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--deep);color:#fff;border-radius:10px;padding:9px 16px;z-index:60;font-size:15px;max-width:calc(100% - 32px)}
.sampleban{grid-column:1/-1;font-size:13px;color:var(--muted);margin:-4px 0 0}

@media (max-width:820px){.app{grid-template-columns:minmax(0,1fr)}
 .rail{position:static;flex-direction:row;overflow-x:auto;padding:6px}.nb{flex:0 0 auto}.railnote{display:none}
