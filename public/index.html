<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Gramik Desk Sign-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#F3F6F4;--ink:#1D2A24;--muted:#61706A;--line:#DFE6E2;--green:#2B5E45;--deep:#1F4A35;--mint:#E4F1E9;--hot:#C9353A;--hot-bg:#FCEBEC;
 --display:Outfit,"Mukta",system-ui,sans-serif;--body:Mukta,"Noto Sans Devanagari",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding:24px 16px}
.wrap{width:min(420px,100%);display:flex;flex-direction:column;gap:16px}
.brand{background:linear-gradient(160deg,#2E6449,#1F4A35);color:#fff;border-radius:16px;padding:22px 24px}
.brand b{display:block;font:600 24px/1.2 var(--display);letter-spacing:-.01em}.brand span{color:#CFE3D6;font-size:14.5px}
form{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
h1{font:600 19px var(--display);color:var(--deep);margin:0}
label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
input{font:inherit;font-size:16px;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
input:focus{outline:2px solid #3E8E5E;outline-offset:1px}
button{font:600 16px var(--body);border:0;border-radius:10px;padding:11px 14px;background:var(--green);color:#fff;cursor:pointer;min-height:46px}
button:disabled{opacity:.6;cursor:default}button:focus-visible{outline:2px solid #F2A65A;outline-offset:2px}
.err{background:var(--hot-bg);color:var(--hot);border-radius:10px;padding:8px 12px;font-size:14.5px;margin:0}
.foot{font-size:13px;color:var(--muted);text-align:center;margin:0}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><b>Gramik Agronomist Desk</b><span>Crop → product recommendations on every farmer call</span></div>
  <form id="f" autocomplete="on">
    <h1>Sign in</h1>
    <label>Username<input name="username" id="u" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Password<input name="password" id="p" type="password" autocomplete="current-password" required></label>
    <p class="err" id="err" hidden></p>
    <button type="submit" id="go">Sign in</button>
    <p class="foot">Agronomists open their call desk. The admin login opens the admin desk.</p>
  </form>
</main>
<script>
(function () {
  var next = new URLSearchParams(location.search).get('next') || '';
  var safeNext = /^\/(desk|admin)\b/.test(next) ? next : '';
  var err = document.getElementById('err'), go = document.getElementById('go');
  fetch('/api/me', {credentials: 'same-origin', cache: 'no-store'}).then(function (r) { return r.ok ? r.json() : null }).then(function (j) {
    if (j && j.user) location.replace(safeNext || (j.user.role === 'admin' ? '/admin' : '/desk'));
  }).catch(function () {});
  document.getElementById('u').focus();
  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault(); err.hidden = true; go.disabled = true; go.textContent = 'Signing in…';
    try {
      var r = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, credentials: 'same-origin',
        body: JSON.stringify({username: e.target.username.value, password: e.target.password.value})});
      var j = await r.json().catch(function () { return {} });
      if (!r.ok) throw new Error(j.error || 'Could not sign in.');
      var to = j.go;
      if (safeNext && ((j.user.role === 'admin' && safeNext.indexOf('/admin') === 0) || (j.user.role === 'admin' && /[?&]as=/.test(safeNext)) || (j.user.role === 'agronomist' && safeNext.indexOf('/desk') === 0 && !/[?&]as=/.test(safeNext)))) to = safeNext;
      location.replace(to);
    } catch (x) { err.textContent = x.message === 'Failed to fetch' ? 'Not connected. Check the internet and try again.' : x.message; err.hidden = false; go.disabled = false; go.textContent = 'Sign in' }
  });
})();
</script>
</body>
</html>
